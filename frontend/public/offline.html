<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#46302b">
<title>모여락</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5ebdd;color:#46302b;font-family:'Noto Sans KR',system-ui,sans-serif;text-align:center;padding:24px}
  .box{max-width:320px}
  .logo{display:inline-block;border:2px solid #46302b;border-radius:8px;padding:6px 18px;font-size:26px;font-weight:700;margin-bottom:20px}
  p{line-height:1.6;margin:8px 0}
  button{margin-top:16px;background:#46302b;color:#f5ebdd;border:0;border-radius:8px;padding:12px 24px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <div class="logo">모여락</div>
  <p><b>인터넷에 연결되어 있지 않아요</b></p>
  <p>연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button onclick="location.reload()">다시 시도</button>
</div>
</body>
</html>
